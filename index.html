<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="h-screen w-screen-lg bg-black flex">
        <div class="w-1/2 bg-rose-300">
            <div class="font-romantic text-6xl text-gray-900 mx-24 my-52 relative">
                <span class="text-rose-500">We</span> never said it<br> but <span class="text-rose-500">we</span> knew it, <br> it's a air of <span class="text-red-500 animate-floatHeart">❤</span><span class="text-rose-500"><br>right</span> ?
                <div class="relative ml-6 w-6/12 h-40 flex items-center justify-center gap-10">
                    <button id="yesBtn" class="mr-64 px-8 py-3 rounded-full bg-rose-500 text-white text-lg
                        transition-transform duration-300 ease-out hover:scale-105 active:scale-95">
                        <div id="hearts" class="absolute inset-0 pointer-events-none"></div>
                        Yes
                    </button>
                    <button
                        id="noBtn"
                        class="px-8 py-3 rounded-full bg-gray-300 text-gray-700 text-lg 
                        absolute  transition-transform duration-500 ease-out
                        will-change-transform">
                        No
                    </button>
                </div>
                <div
                    id="romanticText"
                    class="
                        opacity-0
                        mt-8
                        text-rose-600 text-4xl
                        font-romantic
                        transition-opacity duration-1000 ease-in-out
                        ">
                        Some feelings choose us quietly <span class="text-red-500 animate-floatHeart">❤</span>
            </div>
            </div>
        </div>
        <div class="w-1/2 bg-rose-200 relative overflow-hidden">
            <div class="
                        absolute inset-0
                        rounded-[40px]
                        bg-gradient-to-r from-red-50 via-rose-400 to-pink-50 mr-10
                        blur-3xl
                        opacity-70
                        animate-glow">
            </div>
            <img
                src="us.png"
                alt=""
                class="
                relative z-10
                h-full
                w-full
                object-contain
                animate-floatLine
                motion-reduce:animate-none
                "
            />
        </div>
    </div>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const noBtn = document.getElementById("noBtn");

        if (!noBtn) return;

        noBtn.addEventListener("mouseenter", () => {
        const x = Math.random() * 300 - 150;
        const y = Math.random() * 200 - 100;
        noBtn.style.transform =
            `translate(${x}px, ${y}px) rotate(10deg)`;
        });

        noBtn.addEventListener("touchstart", () => {
        const x = Math.random() * 300 - 150;
        const y = Math.random() * 200 - 100;
        noBtn.style.transform =
            `translate(${x}px, ${y}px) rotate(10deg)`;
        });
    });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
        const yesBtn = document.getElementById("yesBtn");
        const text = document.getElementById("romanticText");
        const hearts = document.getElementById("hearts");

        yesBtn.addEventListener("click", () => {
            text.classList.remove("opacity-0");
            text.classList.add("opacity-100");

            const count = 28;

            for (let i = 0; i < count; i++) {
            const heart = document.createElement("span");
            heart.innerHTML = "❤";

            heart.style.position = "absolute";
            heart.style.left = "50%";
            heart.style.top = "55%";
            heart.style.fontSize = 46 + Math.random() * 26 + "px";
            heart.style.color = "#fb7188";
            heart.style.opacity = "0.85";
            heart.style.transform = "translate(-50%, -50%)";

            hearts.appendChild(heart);

            const x = (Math.random() - 0.5) * 520;
            const y = (Math.random() - 0.5) * 540 - 40;

            requestAnimationFrame(() => {
                heart.style.transition =
                "transform 3s ease-out, opacity 2.4s ease-out";
                heart.style.transform =
                `translate(${x}px, ${y}px) scale(1.25)`;
                heart.style.opacity = "0";
            });

            setTimeout(() => heart.remove(), 2400);
            }
        });
        });
    </script>
</body>
</html>
